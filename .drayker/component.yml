schema_version: 1
component:
  id: drayker-propagation
  name: Drayker Propagation
  layer: COMMUNITY
  artifact_type: portal
  problem: Give volunteers a source-led way to explain, translate and connect people to Drayker while making the public design system reusable.
  scope:
    - Public propagation guidance, message starters and volunteer mission selection.
    - Organized reuse of the Drayker logo variations, interactive mark engine, design tokens, examples and official exports.
    - Navigation to public documentation, discussion and contribution entrypoints.
  non_scope:
    - Governance decisions or authoritative technical claims about other Drayker components.
    - Private volunteer coordination, contact collection or campaign analytics.
    - The production content of drayker.org, drayker.com or the public forum.
  dependencies:
    - drayker.org
    - general-forum
  implementation:
    level: operational
    scope: The static propagation portal and reusable design library are published through GitHub Pages at propagation.drayker.org.
    evidence:
      - type: deployment
        ref: https://propagation.drayker.org/
      - type: document
        ref: README.md
      - type: test
        ref: tools/check.js
  risks:
    - Volunteer material can drift from primary sources if links and message starters are not reviewed.
    - Reusable visual components can be mistaken for permission to alter the official mark.
    - Archived design explorations can be confused with approved production variants without the library labels and usage guide.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/general-forum/issues/new?template=volunteer-introduction.yml
  source_of_truth:
    repository: https://github.com/draykerdk/drayker-propagation
    path: index.html
  last_reviewed: "2026-08-11"
